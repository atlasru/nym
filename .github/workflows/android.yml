name: Nym Mobile
on:
  push:
    branches: [main, 'feature/nym-mobile-*', 'fix/android-*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main, 'feature/nym-mobile-0.1.0']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    name: Kotlin tests, lint, signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Package and verify debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Nym_Mobile_0.1.1_arm64-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Nym_Mobile_0.1.1_arm64-debug.apk > dist/SIGNATURE.txt
          cd dist
          sha256sum Nym_Mobile_0.1.1_arm64-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nym_Mobile_0.1.1_arm64-debug
          path: android/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-tests-and-lint
          path: |
            android/core/build/reports/
            android/app/build/reports/
            android/core/build/test-results/
  device:
    name: Android API ${{ matrix.api }} emulator workflows
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nym_Mobile_0.1.1_arm64-debug
          path: android/verified-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and test actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: bash ci/verify-device.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-screenshots-and-tests
          path: |
            android/device-artifacts/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  publish:
    name: Publish verified debug APK and device evidence
    needs: [build, device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nym_Mobile_0.1.1_arm64-debug
          path: download/apk
      - uses: actions/download-artifact@v4
        with:
          name: android-api-29-screenshots-and-tests
          path: download/api29
      - uses: actions/download-artifact@v4
        with:
          name: android-api-36-screenshots-and-tests
          path: download/api36
      - uses: actions/download-artifact@v4
        with:
          name: android-unit-tests-and-lint
          path: download/unit
      - name: Publish debug prerelease with checksums and real screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 android/ci/publish-mobile.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nym_Mobile_0.1.1_verified-delivery
          path: published/
          if-no-files-found: error
